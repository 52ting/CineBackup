[package]
name = "cinebackup"
version = "0.4.2"
description = "CineBackup - 影视素材 / DCP 跨平台备份工具"
authors = ["Ronnie"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cinebackup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
sha2 = "0.10"
xxhash-rust = { version = "0.8.12", features = ["xxh64"] }

# ---- 平台相关：读取卷文件系统类型 ----
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
