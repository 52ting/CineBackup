name: build-macos

# 三种触发方式：
#   1) 推送到 main（含首次上传源码）→ 自动出通用二进制包
#   2) 推 tag v*（如 v0.4.0）      → 自动出包
#   3) Actions 页面手动 Run workflow（可选只打本机架构）
# 产物是未签名的 .dmg / .app，下载后按 README 第五节去掉隔离属性即可运行。
on:
  workflow_dispatch:
    inputs:
      universal:
        description: "打包通用二进制（Intel + Apple Silicon）"
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
    # 只改文档 / 工具脚本的提交不触发构建（私有仓库的 macOS runner 按 10 倍扣额度，省着用）。
    # 注意：推 tag 时 GitHub 不评估 paths 过滤，所以打 tag 一定会出包。
    #
    # tools/** 之所以能忽略：本工作流的构建步骤全部是内联的（npm ci + npm run tauri build），
    # 不调用 tools/ 下的任何脚本（build_macos.sh 只是给本机 Mac 手动打包用的）。
    # ⚠️ 以后如果让 CI 去调某个 tools/ 脚本，必须把它的路径从下面删掉，否则会静默不触发。
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE"
      - "tools/**"
      - "cinebackup-builds/**"

jobs:
  build:
    # macos-latest 目前是 Apple Silicon（arm64）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci || npm install

      - name: 打包（通用二进制）
        if: ${{ github.event_name == 'push' || inputs.universal }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: 打包（仅本机架构）
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.universal }}
        run: npm run tauri build

      - name: 上传产物（通用二进制）
        if: ${{ github.event_name == 'push' || inputs.universal }}
        uses: actions/upload-artifact@v4
        with:
          name: CineBackup-macOS-universal
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

      - name: 上传产物（本机架构）
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.universal }}
        uses: actions/upload-artifact@v4
        with:
          name: CineBackup-macOS-host
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
